<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light" />
    <title>DeviceLayoutLab</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <header class="topbar">
        <div class="brand">
          <span class="brand-mark" aria-hidden="true">
            <svg viewBox="0 0 32 32" fill="none"><rect x="8" y="8" width="16" height="16" rx="4" /><path d="M12 2v6m8-6v6M12 24v6m8-6v6M2 12h6m-6 8h6m16-8h6m-6 8h6M12 12h8v8h-8z" /></svg>
          </span>
          <div>
            <p class="eyebrow">DEVICE · LAYOUT · CIRCUIT</p>
            <h1>DeviceLayoutLab</h1>
          </div>
        </div>
        <div class="case-picker">
          <label for="case-group-select">预设案例</label>
          <select id="case-group-select" aria-label="选择案例类别"></select>
          <span class="case-separator" aria-hidden="true">/</span>
          <select id="case-select" aria-label="选择预设案例"></select>
          <span id="source-badge" class="source-badge"></span>
        </div>
      </header>

      <section class="context-bar" aria-label="案例状态">
        <span id="case-title">正在加载案例…</span>
        <span id="case-status" class="status"></span>
        <span id="case-stage"></span>
      </section>

      <section class="workspace">
        <aside class="sidebar panel" aria-label="工作台导航">
          <div class="sidebar-heading">
            <span class="sidebar-title">工作台</span>
            <button id="sidebar-toggle" class="icon-button" type="button" aria-expanded="true" aria-controls="sidebar-content" aria-keyshortcuts="Control+b" aria-label="收起左侧边栏" title="收起左侧边栏（Ctrl+B）">‹</button>
          </div>
          <nav class="sidebar-nav" aria-label="选择面板">
            <button type="button" data-panel="objects" aria-pressed="true" aria-controls="objects-section" aria-label="对象" title="对象"><span aria-hidden="true">▱</span><span class="nav-label">对象</span></button>
          </nav>
          <div id="sidebar-content">
            <div class="sidebar-body">
              <section id="objects-section" aria-label="选择对象">
                <div id="object-list" class="object-list" aria-label="对象列表"></div>
              </section>
            </div>
          </div>
        </aside>

        <section class="view-grid" aria-label="二维和三维联动工作台">
          <article class="logic-banner" aria-label="案例逻辑功能">
            <h2 id="logic-kind" class="logic-kind"></h2>
            <div class="logic-summary">
              <span id="logic-case-name" class="logic-case-name"></span>
              <strong id="logic-formula" class="logic-formula"></strong>
            </div>
            <div class="tour-toolbar" role="group" aria-label="版图逐步演示">
              <button id="tour-play" class="tool-button" type="button" aria-label="播放" title="播放">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m8 5 11 7-11 7z" /></svg>
              </button>
              <button id="tour-restart" class="tool-button" type="button" aria-label="重来" title="重来">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 11a8 8 0 1 1 2.2 6M4 5v6h6" /></svg>
              </button>
              <button id="tour-pause" class="tool-button" type="button" aria-label="暂停" title="暂停">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14m8-14v14" /></svg>
              </button>
              <button id="tour-previous" class="tool-button" type="button" aria-label="上一步" title="上一步">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 5v14m11-14L9 12l9 7z" /></svg>
              </button>
              <button id="tour-next" class="tool-button" type="button" aria-label="下一步" title="下一步">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 5 9 7-9 7zM17 5v14" /></svg>
              </button>
              <span id="tour-status" class="visually-hidden" role="status" aria-live="polite"></span>
            </div>
          </article>
          <section class="derivation-grid" aria-label="从版图到电路的四步对照">
            <article class="view-panel panel" id="layout-panel">
              <div class="panel-heading"><h2><b class="step-number">01</b> 单元版图</h2><button class="tool-button diagram-text-toggle" type="button" data-diagram-text="layout-view" aria-pressed="true" aria-label="隐藏单元版图文字" title="隐藏文字"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7V4h16v3M12 4v16M8 20h8" /></svg></button></div>
              <svg id="layout-view" class="teaching-diagram" role="img" aria-label="教学 CMOS 单元版图"></svg>
            </article>
            <article class="view-panel panel">
              <div class="panel-heading"><h2><b class="step-number">02</b> 棍图</h2><button class="tool-button diagram-text-toggle" type="button" data-diagram-text="stick-view" aria-pressed="true" aria-label="隐藏棍图文字" title="隐藏文字"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7V4h16v3M12 4v16M8 20h8" /></svg></button></div>
              <svg id="stick-view" class="teaching-diagram" role="img" aria-label="对应单元的棍图"></svg>
            </article>
            <article class="view-panel panel">
              <div class="panel-heading"><h2><b class="step-number">03</b> 位置对应电路</h2></div>
              <svg id="positional-view" class="teaching-diagram" role="img" aria-label="保持版图器件位置的电路图"></svg>
            </article>
            <article class="view-panel panel">
              <div class="panel-heading"><h2><b class="step-number">04</b> 整理后的电路</h2></div>
              <svg id="circuit-view" class="teaching-diagram" role="img" aria-label="标准串并联 CMOS 电路图"></svg>
            </article>
          </section>
          <article class="view-panel panel" id="model-panel">
            <div class="panel-heading">
              <h2>三维教学结构</h2>
              <div class="model-toolbar" role="group" aria-label="三维视图工具">
                <button id="model-reset" class="tool-button" type="button" aria-label="复原视角" title="复原视角并适配结构">
                  <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 3H3v5M16 3h5v5m0 8v5h-5M8 21H3v-5M12 8v8m-4-4h8" /></svg>
                </button>
                <button id="model-pin" class="tool-button" type="button" aria-pressed="false" aria-label="固定页面" title="固定页面，滚轮缩放三维">
                  <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m15 3 6 6-4 1-4 5v3l-3-3-6 6m6-6-4-4h3l5-4z" /></svg>
                </button>
                <button id="model-grid" class="tool-button" type="button" aria-pressed="true" aria-label="显示网格" title="显示网格">
                  <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="1" /><path d="M9 3v18M15 3v18M3 9h18M3 15h18" /></svg>
                </button>
                <button id="model-labels" class="tool-button" type="button" aria-pressed="true" aria-label="显示文本" title="显示对象标注">
                  <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7V4h16v3M12 4v16M8 20h8" /></svg>
                </button>
              </div>
            </div>
            <div id="model-view" class="model-view" aria-label="Three.js 三维教学模型"></div>
            <p id="model-hint" class="model-hint" aria-live="polite">中键拖动旋转 · 滚轮上下浏览 · 左键选择对象</p>
          </article>
        </section>

        <aside class="inspector panel">
          <div class="panel-heading inspector-heading">
            <h2 id="inspector-title">对象说明</h2>
            <button id="inspector-toggle" class="icon-button" type="button" aria-expanded="true" aria-controls="inspector-body" aria-keyshortcuts="Control+l" aria-label="收起右侧边栏" title="收起右侧边栏（Ctrl+L）">›</button>
          </div>
          <div id="inspector-body">
            <div class="inspector-inner">
              <div id="inspector-content" class="inspector-content">
                <p>选择二维或三维对象，查看其来源、角色和教学边界。</p>
              </div>
              <div id="visibility-controls" class="visibility-controls" aria-label="对象可见性"></div>
            </div>
          </div>
        </aside>
      </section>

      <footer class="evidence-note">
        <span>教学场景、工艺重建和 ORFS 结果分别标注来源。</span>
        <span>三维观察只改变视角，不改变电气拓扑或真实几何。</span>
      </footer>
    </main>
    <script type="module" src="./src/app.js"></script>
  </body>
</html>
