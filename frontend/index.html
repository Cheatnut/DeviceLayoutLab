<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light" />
    <title>DeviceLayoutLab</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <header class="topbar">
        <div class="brand">
          <span class="brand-mark" aria-hidden="true">
            <svg viewBox="0 0 32 32" fill="none"><rect x="8" y="8" width="16" height="16" rx="4" /><path d="M12 2v6m8-6v6M12 24v6m8-6v6M2 12h6m-6 8h6m16-8h6m-6 8h6M12 12h8v8h-8z" /></svg>
          </span>
          <div>
            <p class="eyebrow">DEVICE · LAYOUT · CIRCUIT</p>
            <h1>DeviceLayoutLab</h1>
          </div>
        </div>
        <div class="case-picker">
          <label for="case-group-select">预设案例</label>
          <select id="case-group-select" aria-label="选择案例类别"></select>
          <span class="case-separator" aria-hidden="true">/</span>
          <select id="case-select" aria-label="选择预设案例"></select>
          <span id="source-badge" class="source-badge"></span>
        </div>
      </header>

      <section class="context-bar" aria-label="案例状态">
        <span id="case-title">正在加载案例…</span>
        <span id="case-status" class="status"></span>
        <span id="case-pdk"></span>
        <span id="case-stage"></span>
      </section>

      <section class="workspace">
        <aside class="sidebar panel" aria-label="工作台导航">
          <div class="sidebar-heading">
            <span class="sidebar-title">工作台</span>
            <button id="sidebar-toggle" class="icon-button" type="button" aria-expanded="true" aria-controls="sidebar-content" aria-keyshortcuts="Control+b" aria-label="收起左侧边栏" title="收起左侧边栏（Ctrl+B）">‹</button>
          </div>
          <nav class="sidebar-nav" aria-label="选择面板">
            <button type="button" data-panel="objects" aria-pressed="true" aria-controls="objects-section" aria-label="对象与图层" title="对象与图层"><span aria-hidden="true">▱</span><span class="nav-label">对象与图层</span></button>
            <button type="button" data-panel="library" aria-pressed="false" aria-controls="library-section" aria-label="工艺库" title="工艺库"><span aria-hidden="true">▦</span><span class="nav-label">工艺库</span></button>
          </nav>
          <div id="sidebar-content">
            <div class="sidebar-body">
              <section id="objects-section" aria-label="对象与图层">
                <div id="object-list" class="object-list" aria-label="对象列表"></div>
                <div class="layer-controls">
                  <p>显示图层</p>
                  <label><input type="checkbox" data-layer="M1" checked /> M1 · 单元与电源轨</label>
                  <label><input type="checkbox" data-layer="M2" checked /> M2 · 信号走线</label>
                  <label><input type="checkbox" data-layer="VIA1" checked /> VIA1 · 层间连接</label>
                </div>
              </section>
              <section id="library-section" class="library-browser" aria-label="工艺库" hidden>
                <label for="library-pdk">已登记工艺</label>
                <select id="library-pdk" aria-label="选择工艺库"></select>
                <p id="library-status" aria-live="polite">正在检查工艺库…</p>
                <div id="library-cells"></div>
              </section>
            </div>
          </div>
        </aside>

        <section class="view-grid" aria-label="二维和三维联动工作台">
          <article class="view-panel panel" id="layout-panel">
            <div class="panel-heading">
              <h2>二维版图</h2>
              <span>原始平面几何</span>
            </div>
            <svg id="layout-view" viewBox="0 0 270 132" role="img" aria-label="二维标准单元行版图"></svg>
          </article>

          <article class="view-panel panel" id="model-panel">
            <div class="panel-heading">
              <h2>三维教学结构</h2>
              <div class="model-toolbar" role="group" aria-label="三维视图工具">
                <button id="model-reset" class="tool-button" type="button" aria-label="复原视角" title="复原视角并适配结构">
                  <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 3H3v5M16 3h5v5m0 8v5h-5M8 21H3v-5M12 8v8m-4-4h8" /></svg>
                </button>
                <button id="model-pin" class="tool-button" type="button" aria-pressed="false" aria-label="固定页面" title="固定页面，滚轮缩放三维">
                  <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m15 3 6 6-4 1-4 5v3l-3-3-6 6m6-6-4-4h3l5-4z" /></svg>
                </button>
                <button id="model-grid" class="tool-button" type="button" aria-pressed="true" aria-label="显示网格" title="显示网格">
                  <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="1" /><path d="M9 3v18M15 3v18M3 9h18M3 15h18" /></svg>
                </button>
                <button id="model-labels" class="tool-button" type="button" aria-pressed="true" aria-label="显示文本" title="显示对象标注">
                  <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7V4h16v3M12 4v16M8 20h8" /></svg>
                </button>
              </div>
            </div>
            <div id="model-view" class="model-view" aria-label="Three.js 三维教学模型"></div>
            <p id="model-hint" class="model-hint" aria-live="polite">中键拖动旋转 · 滚轮上下浏览 · 左键选择对象</p>
          </article>
        </section>

        <aside class="inspector panel">
          <div class="panel-heading inspector-heading">
            <h2 id="inspector-title">对象说明</h2>
            <button id="inspector-toggle" class="icon-button" type="button" aria-expanded="true" aria-controls="inspector-body" aria-keyshortcuts="Control+l" aria-label="收起右侧边栏" title="收起右侧边栏（Ctrl+L）">›</button>
          </div>
          <div id="inspector-body">
            <div class="inspector-inner">
              <div id="inspector-content" class="inspector-content">
                <p>选择二维或三维对象，查看其来源、角色和教学边界。</p>
              </div>
              <div id="library-detail" class="inspector-content" aria-live="polite" hidden></div>
              <div class="run-card">
                <h3>真实流程实验</h3>
                <p>本切片仅保留受约束运行入口；ORFS 尚未接入。</p>
                <button id="run-button" type="button">提交运行</button>
                <p id="run-message" class="run-message" aria-live="polite"></p>
              </div>
            </div>
          </div>
        </aside>
      </section>

      <footer class="evidence-note">
        <span>教学场景、工艺重建和 ORFS 结果分别标注来源。</span>
        <span>三维观察只改变视角，不改变电气拓扑或真实几何。</span>
      </footer>
    </main>
    <script type="module" src="./src/app.js"></script>
  </body>
</html>
